name: stock-watch

on:
  schedule:
    # GitHub throttle fortement les crons courts : sur */5 il n'execute en pratique
    # qu'un declenchement sur 8 (~40 min d'ecart mesure). Chaque run verifie donc en
    # continu pendant ~38 min pour couvrir l'ecart jusqu'au run suivant.
    # Le groupe de concurrence garde au plus un run en attente : pas d'empilement.
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      notify_now:
        description: "Envoyer une notif avec l'etat courant (test de bout en bout)"
        type: boolean
        default: false

concurrency:
  group: stock-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      # L'etat (quelles tailles ont deja declenche une alerte) survit d'un run
      # a l'autre via le cache : pas de commit parasite dans l'historique.
      - name: Restaurer l'etat
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: stock-state-${{ github.run_id }}
          restore-keys: stock-state-

      - name: Verifier le stock
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ "${{ inputs.notify_now }}" = "true" ]; then
            python3 watch.py --notify-now --loop 1
          else
            python3 watch.py --loop 24 --interval 100
          fi

      - name: Sauvegarder l'etat
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: stock-state-${{ github.run_id }}

      - name: Journal
        if: always()
        run: cat watch.log 2>/dev/null || echo "(pas de journal)"
