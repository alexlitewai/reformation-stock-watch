name: keepalive

# GitHub desactive les workflows planifies apres 60 jours sans activite sur le
# depot. Ce commit mensuel garde le cron vivant.
on:
  schedule:
    - cron: '17 9 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .keepalive
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .keepalive
          git diff --staged --quiet || git commit -m "keepalive: garder le cron actif"
          git push
